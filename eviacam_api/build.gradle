apply plugin: 'com.android.library'

android {
    namespace 'com.crea_si.eviacam.api'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}
